<!DOCTYPE html>
<html>
  <head>
    <title>Da Crew Chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: sans-serif; background-color: #f4f4f4; }
      #form { background: #333; padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #ff0000; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; font-weight: bold; cursor: pointer; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #e0e0e0; }
      .header { background: #222; color: white; padding: 10px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Da Chat Room</h2>
    </div>
    
    <ul id="messages"></ul>
    
    <form id="form" action="">
      <input id="input" autocomplete="off" placeholder="Drop a message..." /><button>Send</button>
    </form>

    <!-- Bring in Da Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      var socket = io();

      var form = document.getElementById('form');
      var input = document.getElementById('input');
      var messages = document.getElementById('messages');

      // When da form is submitted
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (input.value) {
          socket.emit('chat message', input.value);
          input.value = '';
        }
      });

      // When a message comes in from da server
      socket.on('chat message', function(msg) {
        var item = document.createElement('li');
        item.textContent = msg;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });
    </script>
  </body>
</html>
